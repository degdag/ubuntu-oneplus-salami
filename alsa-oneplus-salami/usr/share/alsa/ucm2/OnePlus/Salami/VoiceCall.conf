# Routes the real AudioReach hostless voice-call graph (MultiMedia5/6,
# PCM devices 4/5 per the topology), not the ordinary playback/capture
# front ends. "Earpiece" is the same tfa9873 speaker pair as HiFi's
# Speaker device, attenuated and biased to the top driver via the
# voicecall_spk route in salamisnd.conf, since there is no separate
# earpiece receiver on this hardware.
#
# giulia-voiced opens hw:0,4 / hw:0,5 itself and never asks the sound
# server to select a device/port, so nothing would ever run a
# SectionDevice EnableSequence. Everything the call needs therefore lives
# in the verb's own sequences, which run unconditionally when the
# profile switches to "Voice Call".

SectionVerb {
        EnableSequence [
                cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia5' 1,1"
                cset "name='MultiMedia6 Mixer TX_CODEC_DMA_TX_3' 1,1"

                # Handset mic capture chain (same as HiFi's Mic1 device)
                cset "name='TX DEC0 MUX' SWR_MIC"
                cset "name='TX SMIC MUX0' SWR_MIC1"
                cset "name='TX_AIF1_CAP Mixer DEC0' 1"
                cset "name='ADC4 MUX' INP5"
                cset "name='ADC4_MIXER Switch' 1"
                cset "name='ADC4 Switch' 1"
                cset "name='ADC3 Switch' 1"
                cset "name='TX DEC1 MUX' SWR_MIC"
                cset "name='TX SMIC MUX1' SWR_MIC0"
                cset "name='TX_AIF1_CAP Mixer DEC1' 1"
                cset "name='ADC1_MIXER Switch' 1"
                cset "name='ADC1 Switch' 1"
        ]

        DisableSequence [
                cset "name='ADC4_MIXER Switch' 0"
                cset "name='ADC4 Switch' 0"
                cset "name='TX SMIC MUX0' ZERO"
                cset "name='TX_AIF1_CAP Mixer DEC0' 0"
                cset "name='ADC3 Switch' 0"
                cset "name='ADC1_MIXER Switch' 0"
                cset "name='ADC1 Switch' 0"

                cset "name='SECONDARY_MI2S_RX Audio Mixer MultiMedia5' 0,0"
                cset "name='MultiMedia6 Mixer TX_CODEC_DMA_TX_3' 0,0"
        ]

        Value {
                TQ "Voice"
        }
}

SectionDevice."Speaker" {
        Comment "Speakerphone: both tfa9873 drivers, full volume"

        Value {
                PlaybackPriority 150
                PlaybackPCM "hw:${CardId},4"
                PlaybackChannels 2
        }
}

SectionDevice."Earpiece" {
        Comment "Earpiece substitute: same speaker pair, top driver only, attenuated"

        Value {
                PlaybackPriority 150
                PlaybackPCM "voicecall_spk"
                PlaybackChannels 2
        }
}

SectionDevice."Mic1" {
        Comment "Handset microphones (routing is in the verb sequence above)"

        Value {
                CapturePriority 200
                CapturePCM "hw:${CardId},5"
                CaptureMixerElem "ADC41"
                CaptureMixer "default:${CardId}"
                CaptureChannels 2
        }
}
