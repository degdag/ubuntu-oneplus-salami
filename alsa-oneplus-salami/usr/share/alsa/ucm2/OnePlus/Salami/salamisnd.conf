# Use case configuration for OnePlus 11 5G
# Author: Degdag Mohamed <degdagmohamed@gmail.com>

Syntax 4

SectionUseCase."HiFi" {
        File "/OnePlus/Salami/HiFi.conf"
        Comment "HiFi quality Music."
}

BootSequence [
	cset "name='ADC1 Switch' 0"
	cset "name='ADC2 Switch' 0"
	cset "name='ADC3 Switch' 0"
	cset "name='ADC4 Switch' 0"

	cset "name='ADC1 Volume' 12"
	cset "name='ADC2 Volume' 12"
	cset "name='ADC3 Volume' 12"
	cset "name='ADC4 Volume' 12"
]

LibraryConfig.remap.Config {
	ctl.default.map {
		# Merge two mono controls into one stereo
		"name='ADC41 Volume'" {
			"name='ADC4 Volume'".vindex.0 0
			"name='ADC1 Volume'".vindex.1 0
		}
	}
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"

SectionUseCase."Voice Call" {
        File "/OnePlus/Salami/VoiceCall.conf"
        Comment "Voice call audio (hostless voice graph, MultiMedia5/6)."
}

LibraryConfig.voicecall.Config {
	pcm.voicecall_spk {
		type route
		slave.pcm "hw:${CardId},4"
		slave.channels 2
		ttable.0.0 0.35
		ttable.0.1 0
		ttable.1.0 0
		ttable.1.1 0
	}
}
